packages:
  - 'packages/*'
  - 'apps/*'
  - 'workers/*'
# 允许运行安装脚本的依赖：esbuild（tsx/vitest）、sharp，以及 dsh 宿主的原生依赖。
# core-js 的脚本只打印捐助提示，@scarf/scarf 会上报安装统计，均不运行。
allowBuilds:
  esbuild: true
  sharp: true
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
  protobufjs: true
  '@google/genai': true
  core-js: false
  '@scarf/scarf': false
